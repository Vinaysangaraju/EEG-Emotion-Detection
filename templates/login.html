<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="keywords" content="EEG, emotion detection, Roberts similarity, PSO, machine learning" />
  <meta name="description" content="Login to our EEG-based emotion detection platform using Roberts Similarity and PSO Feature Selection." />
  <meta name="author" content="xAI" />

  <title>Login | EEG-Based Emotion Detection</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: #f5f7fa;
      font-family: 'Inter', sans-serif;
      color: #2d3748;
      min-height: 100vh;
    }
    .header_section {
      background: #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: all 0.3s ease;
    }
    .header_section.scrolled {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
    .navbar-brand img {
      transition: transform 0.3s ease;
    }
    .navbar-brand img:hover {
      transform: rotate(10deg);
    }
    .nav-link {
      position: relative;
      transition: color 0.3s ease;
      color: #4a5568;
      font-weight: 500;
      padding: 0.5rem 1rem;
    }
    .nav-link:hover {
      color: #3182ce;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 0;
      background: #3182ce;
      transition: width 0.3s ease;
    }
    .nav-link:hover::after {
      width: 100%;
    }
    .nav-button {
      background: #3182ce;
      padding: 0.5rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      color: white;
      display: inline-block;
    }
    .nav-button:hover {
      background: #2b6cb0;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
    }
    .login-container {
      max-width: 500px;
      margin: 3rem auto;
      padding: 2.5rem;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }
    .login-container:hover {
      transform: scale(1);
    }
    .login-title {
      font-family: 'Inter', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #2d3748;
      text-align: center;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f7fafc;
      color: #2d3748;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: #3182ce;
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(49, 130, 206, 0.2);
    }
    .form-input::placeholder {
      color: #a0aec0;
    }
    .submit-btn {
      background: #3182ce;
      color: white;
      border: none;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }
    .submit-btn:hover {
      background: #2b6cb0;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
    }
    .register-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #718096;
    }
    .register-link a {
      color: #3182ce;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .register-link a:hover {
      text-decoration: underline;
      color: #2b6cb0;
    }
    .forgot-password {
      text-align: right;
      margin-bottom: 1rem;
    }
    .forgot-password a {
      color: #718096;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .forgot-password a:hover {
      color: #3182ce;
      text-decoration: underline;
    }
    .navbar-toggler {
      border: none;
      background: transparent;
      padding: 0.5rem;
      cursor: pointer;
      display: none;
    }
    .navbar-toggler-icon {
      width: 25px;
      height: 3px;
      background: #3182ce;
      display: block;
      margin: 5px 0;
      transition: all 0.3s ease;
    }
    .mobile-menu {
      display: none;
      width: 100%;
    }
    .mobile-menu.active {
      display: block;
    }
    @media (max-width: 768px) {
      .navbar-toggler {
        display: block;
      }
      .desktop-menu {
        display: none;
      }
      .mobile-menu {
        padding-top: 1rem;
      }
      .mobile-menu ul {
        flex-direction: column;
        gap: 1rem;
      }
      .login-container {
        margin: 1.5rem;
        padding: 1.5rem;
      }
      .login-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <header class="header_section py-4">
    <div class="container mx-auto px-4">
      <nav class="flex justify-between items-center">
        <a class="navbar-brand flex items-center gap-3" href="{{url_for('index')}}">
          <img src="static/images/eeg-logo.jpg" height="40" width="40" alt="">
          <span class="text-xl font-bold text-gray-800">Emotion Detection</span>
        </a>
        
        <button class="navbar-toggler lg:hidden" type="button" id="mobile-menu-button">
          <span class="navbar-toggler-icon"></span>
          <span class="navbar-toggler-icon"></span>
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <!-- Desktop Menu -->
        <div class="desktop-menu hidden lg:block">
          <ul class="flex items-center gap-6">
            <li>
              <a class="nav-link" href="{{url_for('index')}}">Home</a>
            </li>
            <li>
              <a class="nav-button" href="{{url_for('register')}}">Register</a>
            </li>
            <li>
              <a class="nav-button" href="{{url_for('login')}}">Login</a>
            </li>
          </ul>
        </div>
        
        <!-- Mobile Menu -->
        <div class="mobile-menu lg:hidden" id="mobile-menu">
          <ul class="flex flex-col items-center gap-4">
            <li>
              <a class="nav-link" href="{{url_for('index')}}">Home</a>
            </li>
            <li>
              <a class="nav-button" href="{{url_for('register')}}">Register</a>
            </li>
            <li>
              <a class="nav-button" href="{{url_for('login')}}">Login</a>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <div class="login-container">
      <h1 class="login-title">Welcome Back</h1>
      
      <form action="{{url_for('login')}}" method="post">
        <div class="form-group">
          <input class="form-input" type="email" name="email" placeholder="Email Address" required />
        </div>
        
        <div class="form-group">
          <input class="form-input" type="password" name="password" placeholder="Password" required />
        </div>
        
        <div class="forgot-password">
          <a href="#">Forgot Password?</a>
        </div>
        
        <button type="submit" class="submit-btn">
          Sign In
        </button>
      </form>
      
      <div class="register-link">
        Don't have an account? <a href="{{url_for('register')}}">Register now</a>
      </div>
    </div>
  </main>

  {% if message %}
    <script>
      alert("{{ message }}");
    </script>
  {% endif %}

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    // Mobile menu toggle
    document.getElementById('mobile-menu-button').addEventListener('click', function() {
      const mobileMenu = document.getElementById('mobile-menu');
      mobileMenu.classList.toggle('active');
      
      // Animate the hamburger icon
      const bars = this.querySelectorAll('.navbar-toggler-icon');
      if (mobileMenu.classList.contains('active')) {
        bars[0].style.transform = 'rotate(45deg) translate(5px, 5px)';
        bars[1].style.opacity = '0';
        bars[2].style.transform = 'rotate(-45deg) translate(6px, -6px)';
      } else {
        bars[0].style.transform = '';
        bars[1].style.opacity = '';
        bars[2].style.transform = '';
      }
    });

    // Form validation
    const form = document.querySelector('form');
    if (form) {
      form.addEventListener('submit', function(e) {
        const email = form.querySelector('input[name="email"]');
        const password = form.querySelector('input[name="password"]');
        
        if (!email.value || !password.value) {
          e.preventDefault();
          alert('Please fill in all fields!');
        }
      });
    }
  </script>
</body>
</html>
